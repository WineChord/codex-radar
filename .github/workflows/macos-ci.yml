name: macOS CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: macos-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Tests (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Toolchain and source checks
        run: |
          swift --version
          xcodebuild -version
          python3 scripts/release_version.py
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'
          git diff --check
          for script in scripts/*.sh; do bash -n "$script"; done
      - name: Unit tests
        run: swift test
      - name: Production build
        run: swift build -c release

  package:
    name: Live contracts and universal package
    needs: test
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CODEX_RADAR_UNIVERSAL: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install screenshot dependency
        run: |
          python3 -m venv "$RUNNER_TEMP/radar-screenshots"
          "$RUNNER_TEMP/radar-screenshots/bin/python" -m pip install 'pillow==12.3.0'
          echo "$RUNNER_TEMP/radar-screenshots/bin" >> "$GITHUB_PATH"
      - name: Live contracts, screenshots and verified release packages
        run: |
          version="$(python3 scripts/release_version.py)"
          ./scripts/check_release_readiness.sh "$version"
          {
            echo "### Validated macOS build"
            echo "Commit: $GITHUB_SHA"
            echo "Version: $version"
            echo 'Architectures: arm64 and x86_64'
            echo 'Ad-hoc signed; not Developer ID signed or notarized.'
            echo 'CI artifacts are test builds, not published updates.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload verified installation packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macOS-universal-${{ github.sha }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Upload rendered screenshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macOS-screenshots-${{ github.sha }}
          path: docs/assets/
          if-no-files-found: error
          retention-days: 7
